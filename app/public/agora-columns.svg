<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Fondo -->
  <circle cx="96" cy="96" r="96" fill="#1B3A6B"/>
  
  <!-- Círculo dorado interior -->
  <circle cx="96" cy="96" r="85" fill="none" stroke="#C9A84C" stroke-width="3"/>
  
  <!-- Elementos del Ágora: Columnas -->
  <g fill="#E8C97A">
    <!-- Columna izquierda -->
    <rect x="45" y="50" width="8" height="90" rx="2"/>
    <!-- Columna central -->
    <rect x="92" y="40" width="8" height="100" rx="2"/>
    <!-- Columna derecha -->
    <rect x="139" y="50" width="8" height="90" rx="2"/>
  </g>
  
  <!-- Ornamento superior -->
  <circle cx="96" cy="35" r="4" fill="#C9A84C"/>
  <circle cx="85" cy="40" r="3" fill="#C9A84C" opacity="0.7"/>
  <circle cx="107" cy="40" r="3" fill="#C9A84C" opacity="0.7"/>
</svg>